<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hörbücher</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15141a; color: #f1eef5;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  a { color: #e9895c; }
  .muted { color: #a09cab; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <p id="msg">Hörbücher werden geöffnet …</p>
  <p class="muted" id="hint"></p>
</main>
<script>
  // Holt die aktuelle Tunnel-Adresse (der Mac mini aktualisiert url.json) und leitet weiter.
  fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json())
    .then(({ url, updated }) => {
      if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url)) throw new Error('ungültig');
      document.getElementById('msg').innerHTML = 'Weiter zu <a href="' + url + '">' + url.replace('https://', '') + '</a>';
      location.replace(url);
    })
    .catch(() => {
      document.getElementById('msg').textContent = 'Der Hörbuch-Server ist gerade nicht erreichbar.';
      document.getElementById('hint').textContent = 'Bitte später noch einmal versuchen.';
    });
</script>
</body>
</html>
